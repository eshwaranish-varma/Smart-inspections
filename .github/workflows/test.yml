name: Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# code scanning upload; fork PRs may not have access — steps handle that
permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy backend/app --ignore-missing-imports || true
        continue-on-error: true

      - name: Run pytest
        env:
          PYTHONPATH: backend
          # Pydantic settings require a valid postgres:// URI even when tests do not open DBs
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-report=xml --cov-report=term


      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests (Node.js)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: src/gui/package-lock.json

      - name: Install dependencies
        working-directory: src/gui
        run: npm ci

      - name: Lint with ESLint
        working-directory: src/gui
        run: npm run lint --if-present || true
        continue-on-error: true

      - name: Type check with TypeScript
        working-directory: src/gui
        run: npx tsc --noEmit || true
        continue-on-error: true

      - name: Run tests
        working-directory: src/gui
        run: npm test --if-present --watchAll=false --coverage || true
        continue-on-error: true

      - name: Build
        working-directory: src/gui
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          # Pass secrets in env (safe); apply shell defaults in `run` — avoids GHA `||` quirks with secrets
          NEXT_OUTPUT_TRACING_ROOT: ${{ github.workspace }}/src/gui
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          export NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL:-https://ci-build.example.com}"
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://ci-api.example.com}"
          export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://example.supabase.co}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY:-ci-build-placeholder}"
          export DATABASE_URL="${DATABASE_URL:-postgresql://ci:ci@127.0.0.1:5432/ci}"
          export JWT_SECRET="${JWT_SECRET:-ci-jwt-secret-at-least-32-chars-0000}"
          npm run build

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: smart-inspection-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (smoke)
        uses: docker/build-push-action@v4
        with:
          context: ./src/gui
          file: ./src/gui/Dockerfile
          push: false
          tags: smart-inspection-frontend:ci
          build-args: |
            NEXT_PUBLIC_APP_URL=https://ci-frontend.example.com
            NEXT_PUBLIC_API_URL=https://ci-api.example.com
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-docker-build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          # Do not fail the whole workflow; findings still appear in SARIF / job log
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        # Fork PRs cannot upload SARIF to the base repo’s Code Scanning API
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"
