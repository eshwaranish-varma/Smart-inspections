name: Health Check & Monitoring

on:
  schedule:
    # Run every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Backend Health
        continue-on-error: true
        run: |
          echo "Checking backend API..."
          # Optional: set PRODUCTION_API_BASE in secrets to override (no trailing /api; health is at /api/health)
          if [ -n "${{ secrets.PRODUCTION_API_BASE }}" ]; then
            API="${{ secrets.PRODUCTION_API_BASE }}"
          else
            API="https://smartinspection-production-i8ete.ondigitalocean.app"
          fi
          curl -f -sS "$API/api/health" || (echo "Backend health check failed" && exit 1)

      - name: Check Frontend Health
        continue-on-error: true
        run: |
          # Set FRONTEND_PRODUCTION_URL in repository secrets (e.g. Vercel or DigitalOcean app URL)
          F="${{ secrets.FRONTEND_PRODUCTION_URL }}"
          if [ -z "$F" ]; then
            echo "FRONTEND_PRODUCTION_URL not set – skipping dedicated frontend host check (optional)."
            exit 0
          fi
          echo "Checking frontend: $F"
          curl -fsS -I "$F" | head -n 1

      - name: Check Database Connection
        # Pass the URI as an env var so shell metacharacters in passwords (e.g. & $ `) are not
        # mis-parsed. Inline "${{ secrets.DATABASE_URL }}" in psql often breaks, which makes
        # psql fall back to a local socket and this exact error.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set – skipping direct DB check."
            exit 0
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "DATABASE_URL must start with postgres:// or postgresql:// – skipping."; exit 0 ;;
          esac
          echo "Testing database connectivity (remote TCP)..."
          if ! command -v psql >/dev/null 2>&1; then
            echo "psql not on PATH (unexpected on ubuntu-latest) – skipping."
            exit 0
          fi
          if psql "$DATABASE_URL" -c "SELECT 1 AS ok;" 2>&1; then
            echo "OK: database accepted a query from this runner."
            exit 0
          fi
          echo "⚠ Direct psql from GitHub Actions failed. Common causes:"
          echo "  - Password or URL with characters that need encoding in the connection string"
          echo "  - Network / IP allowlist (use Supabase pooler or allow 0.0.0.0/0 per Supabase guide)"
          echo "  - Missing ssl: append ?sslmode=require to the URI (Supabase)"
          echo "This step is informational; it does not fail the workflow."
          exit 0

      - name: Check API Response Time
        run: |
          if [ -n "${{ secrets.PRODUCTION_API_BASE }}" ]; then
            API="${{ secrets.PRODUCTION_API_BASE }}"
          else
            API="https://smartinspection-production-i8ete.ondigitalocean.app"
          fi
          echo "Measuring API response time: $API/api/health"
          # Note: `time` output format varies; this is a best-effort log only
          curl -sS -o /dev/null -w "HTTP time_total: %{time_total}s\n" "$API/api/health"

