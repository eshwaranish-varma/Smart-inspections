name: Deploy Frontend (Vercel)

on:
  push:
    branches: [main]
    paths:
      - "src/gui/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/gui/package-lock.json

      - name: Install dependencies
        working-directory: src/gui
        run: npm ci

      - name: Lint
        working-directory: src/gui
        run: npm run lint --if-present || true
        continue-on-error: true

      - name: Build
        working-directory: src/gui
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_OUTPUT_TRACING_ROOT: ${{ github.workspace }}/src/gui
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          export NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL:-https://smart-inspection-team.vercel.app}"
          export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://example.supabase.co}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY:-build-placeholder}"
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://example.com}"
          export DATABASE_URL="${DATABASE_URL:-postgresql://ci:ci@127.0.0.1:5432/ci}"
          export JWT_SECRET="${JWT_SECRET:-ci-jwt-secret-at-least-32-chars-0000}"
          npm run build

  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/gui/package-lock.json

      - name: Install dependencies
        working-directory: src/gui
        run: npm ci

      - name: Validate Vercel secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "ERROR: VERCEL_TOKEN not set"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "ERROR: VERCEL_PROJECT_ID not set"
            exit 1
          fi
          echo "✓ Vercel secrets validated"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment production \
            --token ${{ secrets.VERCEL_TOKEN }}
        working-directory: src/gui

      - name: Build for production
        working-directory: src/gui
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_OUTPUT_TRACING_ROOT: ${{ github.workspace }}/src/gui
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          export NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL:-https://smart-inspection-team.vercel.app}"
          export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://example.supabase.co}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY:-vercel-build-placeholder}"
          export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://example.com}"
          export DATABASE_URL="${DATABASE_URL:-postgresql://ci:ci@127.0.0.1:5432/ci}"
          export JWT_SECRET="${JWT_SECRET:-vercel-jwt-secret-placeholder-32min!!}"
          npm run build

      - name: Deploy to Vercel
        working-directory: src/gui
        run: |
          vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Health check
        run: |
          echo "Running health check..."
          if [ -n "${{ secrets.FRONTEND_PRODUCTION_URL }}" ]; then
            U="${{ secrets.FRONTEND_PRODUCTION_URL }}"
          else
            U="https://smart-inspection.vercel.app"
          fi
          for i in {1..10}; do
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "$U" || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "304" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "308" ]; then
              echo "✓ Frontend is responding ($U → $STATUS)"
              exit 0
            fi
            echo "Health check attempt $i/10 - Status: $STATUS - URL: $U"
            sleep 6
          done
          echo "⚠ Frontend health check failed. Set FRONTEND_PRODUCTION_URL in repo secrets to your live URL, or check Vercel/DO logs."

  notify:
    name: Notify on deployment
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    # Never block the pipeline if Slack is misconfigured
    continue-on-error: true

    steps:
      - name: Check for Slack webhook
        id: slack_cfg
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Slack skipped: add repository secret SLACK_WEBHOOK_URL to enable notifications."
          fi

      - name: Slack notification
        uses: slackapi/slack-github-action@v1
        if: always() && steps.slack_cfg.outputs.ok == 'true'
        continue-on-error: true
        with:
          payload: |
            {
              "text": "Frontend Deployment: ${{ needs.deploy.result == 'success' && '✅ Success' || '❌ Failed' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Frontend Deployment* - ${{ needs.deploy.result == 'success' && '✅ Success' || '❌ Failed' }}\n*Branch:* main\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*URL:* https://smart-inspection.vercel.app"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
