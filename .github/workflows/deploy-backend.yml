name: Deploy Backend (Render — optional)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  # Quick backend checks before any external deploy hook
  preflight:
    name: Backend tests (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install & pytest
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
          pytest backend/tests/ -q

  build-and-deploy:
    name: Build & Deploy to Render
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only trigger Render when both secrets exist. If you use DigitalOcean / another host,
      # leave these unset — the job skips Render and still runs the health check below.
      - name: Check Render configuration
        id: cfg
        run: |
          if [ -n "${{ secrets.RENDER_API_KEY }}" ] && [ -n "${{ secrets.RENDER_BACKEND_SERVICE_ID }}" ]; then
            echo "use_render=true" >> "$GITHUB_OUTPUT"
            echo "Render deploy: will trigger API deploy via Render."
          else
            echo "use_render=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Render deploy: RENDER_API_KEY and/or RENDER_BACKEND_SERVICE_ID not set."
            echo "This is normal when the API is hosted on DigitalOcean App Platform or elsewhere."
          fi

      - name: Trigger Render deployment
        if: steps.cfg.outputs.use_render == 'true'
        run: |
          curl --request POST \
            --url https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"full"}'

      - name: Wait for deployment
        if: steps.cfg.outputs.use_render == 'true'
        run: |
          echo "Deployment triggered. Checking status..."

          for i in {1..60}; do
            STATUS=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys" \
              | jq -r '.[] | select(.status == "live") | .id' | head -1)

            if [ ! -z "$STATUS" ]; then
              echo "✓ Deployment successful!"
              exit 0
            fi

            echo "Waiting... ($i/60)"
            sleep 5
          done

          echo "⚠ Deployment status check timeout. Check Render dashboard."
          exit 0

      - name: Backend health check
        continue-on-error: true
        env:
          PRODUCTION_API_BASE: ${{ secrets.PRODUCTION_API_BASE }}
          RENDER_API_HEALTH_URL: ${{ secrets.RENDER_API_HEALTH_URL }}
        run: |
          # Full health URL, or base URL + /api/health, or this repo's DigitalOcean default
          if [ -n "$RENDER_API_HEALTH_URL" ]; then
            H="$RENDER_API_HEALTH_URL"
          elif [ -n "$PRODUCTION_API_BASE" ]; then
            H="${PRODUCTION_API_BASE%/}/api/health"
          else
            H="https://smartinspection-production-i8ete.ondigitalocean.app/api/health"
          fi
          echo "GET $H"
          for i in {1..5}; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$H" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "✓ API health OK ($H)"
              exit 0
            fi
            echo "Attempt $i/5 — HTTP $CODE"
            sleep 3
          done
          echo "⚠ Optional health check did not return 200. Set PRODUCTION_API_BASE or RENDER_API_HEALTH_URL if needed."

  notify:
    name: Notify on deployment
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true

    steps:
      - name: Check for Slack webhook
        id: slack_cfg
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Slack skipped: add repository secret SLACK_WEBHOOK_URL to enable notifications."
          fi

      - name: Slack notification
        uses: slackapi/slack-github-action@v1
        if: always() && steps.slack_cfg.outputs.ok == 'true'
        continue-on-error: true
        with:
          payload: |
            {
              "text": "Backend Deployment: ${{ needs.build-and-deploy.result == 'success' && '✅ Success' || '❌ Failed' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Backend Deployment* - ${{ needs.build-and-deploy.result == 'success' && '✅ Success' || '❌ Failed' }}\n*Branch:* main\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
