name: Deploy Backend (Render)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  # Quick backend checks before calling external deploy
  preflight:
    name: Backend tests (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install & pytest
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
          pytest backend/tests/ -q

  build-and-deploy:
    name: Build & Deploy to Render
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate environment
        run: |
          echo "Checking required secrets..."
          if [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "ERROR: RENDER_API_KEY not set"
            exit 1
          fi
          if [ -z "${{ secrets.RENDER_BACKEND_SERVICE_ID }}" ]; then
            echo "ERROR: RENDER_BACKEND_SERVICE_ID not set"
            exit 1
          fi
          echo "✓ All required secrets present"

      - name: Trigger Render deployment
        run: |
          curl --request POST \
            --url https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"full"}'

      - name: Wait for deployment
        run: |
          echo "Deployment triggered. Checking status..."

          for i in {1..60}; do
            STATUS=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys" \
              | jq -r '.[] | select(.status == "live") | .id' | head -1)

            if [ ! -z "$STATUS" ]; then
              echo "✓ Deployment successful!"
              exit 0
            fi

            echo "Waiting... ($i/60)"
            sleep 5
          done

          echo "⚠ Deployment status check timeout. Check Render dashboard."
          exit 0

      - name: Health check
        run: |
          echo "Running health check..."
          if [ -n "${{ secrets.RENDER_API_HEALTH_URL }}" ]; then
            H="${{ secrets.RENDER_API_HEALTH_URL }}"
          else
            H="https://smart-inspection-api.onrender.com/api/health"
          fi
          for i in {1..10}; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$H" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "✓ Backend health check passed ($H)"
              exit 0
            fi
            echo "Health check attempt $i/10 - Status: $CODE"
            sleep 6
          done
          echo "⚠ Backend health check failed after retries. Set RENDER_API_HEALTH_URL secret to your full /api/health URL if it changed."

  notify:
    name: Notify on deployment
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v1
        if: always()
        with:
          payload: |
            {
              "text": "Backend Deployment: ${{ needs.build-and-deploy.result == 'success' && '✅ Success' || '❌ Failed' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Backend Deployment* - ${{ needs.build-and-deploy.result == 'success' && '✅ Success' || '❌ Failed' }}\n*Branch:* main\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
