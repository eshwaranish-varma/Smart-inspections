# Lightweight dev compose: FastAPI only with SQLite on the host.
# For the full stack (Next.js + FastAPI + NGINX), use `docker-compose.yml`.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./smart_inspections.db:/app/smart_inspections.db
    env_file:
      - ./.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
