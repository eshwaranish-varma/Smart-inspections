# Reverse proxy: Next.js (/) + Next /api/* (route handlers) vs FastAPI prefixes.
# Do NOT send all /api to FastAPI — Next.js owns /api/auth, /api/inspections, etc.

upstream fastapi_backend {
    server backend:8000;
    keepalive 8;
}

upstream next_gui {
    server gui:3000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # FastAPI (must match backend/app/main.py router prefixes)
    location ~ ^/api/(observations|ai|documents|ocr|library|citations|references|health|eval|evaluation|eir-pipeline)($|/) {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 180s;
    }

    # Next.js Route Handlers (/api/auth, /api/inspections, …)
    location /api/ {
        proxy_pass http://next_gui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://next_gui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 180s;
    }
}
