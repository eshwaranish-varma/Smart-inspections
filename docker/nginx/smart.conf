# Reverse proxy: Next.js (/) + Next /api/* (route handlers) vs FastAPI /api/* (observations, ai, …)
# FastAPI routes must be listed here so they are not sent to Next.js.

upstream fastapi_backend {
    server backend:8000;
    keepalive 8;
}

upstream next_gui {
    server gui:3000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # FastAPI (must match backend/app/main.py prefixes)
    location ~ ^/api/(observations|ai|documents|ocr|library|citations|references|health)($|/) {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # Next.js Route Handlers (/api/auth, /api/inspections, …)
    location /api/ {
        proxy_pass http://next_gui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://next_gui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
