# Smart Inspections — production stack (external Postgres e.g. Supabase)
#
# Usage (recommended):
#   cp .env.production.example .env.production   # edit secrets
#   docker compose --env-file .env.production up --build -d
#
# Optional local Postgres (not for Supabase prod):
#   docker compose --profile local-db --env-file .env.production up --build -d

services:
  db:
    profiles:
      - local-db
    image: postgres:15-alpine
    container_name: smart-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_inspections}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/gui/lib/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env.production
    environment:
      DATA_DIR: /app/data
      ENVIRONMENT: production
      # Optional: override pooler vs direct in .env.production (DATABASE_POOLER_URL / DATABASE_DIRECT_URL)
    volumes:
      - ./data:/app/data
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  gui:
    build:
      context: ./src/gui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: smart-gui
    ports:
      - "${GUI_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # Server-side route handlers must use Docker service name (not public URL)
      BACKEND_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    logging: *default-logging
    healthcheck:
      # IMAGE sets PORT=3000; sh -c matches Dockerfile when App Platform overrides PORT
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-3000}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.25-alpine
    container_name: smart-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/smart.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      gui:
        condition: service_healthy
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
